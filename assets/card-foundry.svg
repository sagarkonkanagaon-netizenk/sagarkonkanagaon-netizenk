<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1430"/><stop offset="1" stop-color="#070a18"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5c451" stop-opacity=".55"/><stop offset=".5" stop-color="#2dd4bf" stop-opacity=".25"/><stop offset="1" stop-color="#f5c451" stop-opacity=".1"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  
</defs>
<style>
  text{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  
</style>
<rect x="1" y="1" width="598" height="258" rx="16" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="1" y="1" width="598" height="258" rx="16" fill="url(#grid)"/>

<rect x="1" y="1" width="5" height="258" rx="2" fill="#f5c451" opacity=".85"/>
<g class="m" font-size="10.5" font-weight="700" letter-spacing="2.4">
  <circle cx="38" cy="40" r="4" fill="#f5c451"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="50" y="44" fill="#f5c451">LIVE · INTERACTIVE PORTFOLIO</text>
</g>
<text x="32" y="88" font-size="32" font-weight="800" fill="#eef1fa" letter-spacing="-.5">The Data Foundry</text>
<text x="32" y="124" font-size="17" fill="#98a1c0">Watch a data pipeline run in 3D. Break it</text><text x="32" y="148" font-size="17" fill="#98a1c0">on purpose and see how it recovers.</text>
<rect x="32" y="190" width="69" height="22" rx="11" fill="#f5c451" fill-opacity=".09" stroke="#f5c451" stroke-opacity=".38"/><text x="67" y="205" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#f5c451">Next.js</text><rect x="109.19999999999999" y="190" width="77" height="22" rx="11" fill="#f5c451" fill-opacity=".09" stroke="#f5c451" stroke-opacity=".38"/><text x="148" y="205" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#f5c451">Three.js</text><rect x="194.0" y="190" width="145" height="22" rx="11" fill="#f5c451" fill-opacity=".09" stroke="#f5c451" stroke-opacity=".38"/><text x="267" y="205" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#f5c451">live event stream</text>
<text x="568" y="234" text-anchor="end" class="m" font-size="11" font-weight="700" letter-spacing="1.5" fill="#f5c451">OPEN THE FOUNDRY →</text>
<g transform="translate(470 96)">
  <g fill="none" stroke-width="3">
    <circle r="34" stroke="#d9822b" opacity=".85"/><circle r="24" stroke="#a9b6c8" opacity=".85"/><circle r="14" stroke="#f5c451"/>
  </g>
  <circle r="5" fill="#f5c451"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
  <g>
    <circle r="3.5" fill="#ef4444"><animateMotion dur="3s" repeatCount="indefinite" path="M-90,-30 C-60,-30 -40,0 0,0"/><animate attributeName="fill" values="#ef4444;#d9822b;#cbd5e1;#f5c451" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#a855f7"><animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M-90,30 C-60,30 -40,0 0,0"/><animate attributeName="fill" values="#a855f7;#d9822b;#cbd5e1;#f5c451" dur="3s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#64748b"><animateMotion dur="3s" begin="-2s" repeatCount="indefinite" path="M-90,0 C-60,0 -40,0 0,0"/><animate attributeName="fill" values="#64748b;#d9822b;#cbd5e1;#f5c451" dur="3s" begin="-2s" repeatCount="indefinite"/></circle>
  </g></g>
</svg>