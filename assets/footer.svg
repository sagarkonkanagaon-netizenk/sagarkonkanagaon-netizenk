<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1430"/><stop offset="1" stop-color="#070a18"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5c451" stop-opacity=".55"/><stop offset=".5" stop-color="#2dd4bf" stop-opacity=".25"/><stop offset="1" stop-color="#f5c451" stop-opacity=".1"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  
</defs>
<style>
  text{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  
</style>
<rect x="1" y="1" width="1198" height="148" rx="16" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="1" y="1" width="1198" height="148" rx="16" fill="url(#grid)"/>

<text x="600" y="62" text-anchor="middle" font-size="28" font-weight="800" fill="#eef1fa" letter-spacing="-.4">Let's build data people <tspan fill="#f5c451">trust.</tspan></text>
<g transform="translate(600 100)">
  <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".45"/>
  <circle cx="-146" cy="0" r="5" fill="#34d399"><animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.5;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="8" y="5" text-anchor="middle" class="m" font-size="12" font-weight="800" letter-spacing="2" fill="#5eead4">OPEN TO SENIOR DE ROLES</text>
</g>
</svg>