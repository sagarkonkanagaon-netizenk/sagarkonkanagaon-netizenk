<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Sagar Konkanagaon, Senior Data Engineer: a self-healing end-to-end data platform: ingest, store, transform, serve, AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2a46b"/><stop offset="1" stop-color="#9c5b2e"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6ecf5"/><stop offset="1" stop-color="#8d99ad"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#c9971c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:700 30px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#f1f5ff}
      .sub{font:400 15px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9fb0d0}
      .tiny{font:400 10px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#7f8fb0;text-anchor:middle}
      .lbl{font:600 12px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#c8d3ea;text-anchor:middle;letter-spacing:1.5px}
      .pipe{stroke:#2a3a63;stroke-width:6;fill:none;stroke-linecap:round}
      .flow{stroke:#5ec8ff;stroke-width:2;fill:none;stroke-dasharray:6 14;animation:dash 1.4s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-40}}
      .fault{animation:fault 6s ease-in-out infinite}
      @keyframes fault{0%,40%{opacity:0}45%,60%{opacity:1}70%,100%{opacity:0}}
      .heal{animation:heal 6s ease-in-out infinite}
      @keyframes heal{0%,58%{opacity:0}62%,80%{opacity:1}90%,100%{opacity:0}}
      .scan{animation:scan 6s linear infinite;transform-origin:450px 205px}
      @keyframes scan{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.35}}
    </style>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <text x="40" y="58" class="title">Sagar Konkanagaon</text>
  <text x="40" y="84" class="sub">Senior Data Engineer · Lakehouse Architecture · Cloud-Native · AI · Bengaluru</text>
  <g class="pulse"><circle cx="770" cy="52" r="5" fill="#34d399"/></g>
  <text x="782" y="57" class="sub" style="fill:#34d399">open to roles</text>

  <!-- pipes -->
  <path class="pipe" d="M70 190 H830"/>
  <path class="flow" d="M70 190 H830"/>

  <!-- source -->
  <g transform="translate(70,190)">
    <circle r="14" fill="#1b2747" stroke="#5ec8ff" stroke-width="2"/>
    <text y="40" class="lbl">INGEST</text>
    <text y="55" class="tiny">batch · stream · CDC</text>
  </g>

  <!-- chambers -->
  <g transform="translate(260,190)">
    <rect x="-46" y="-34" width="92" height="68" rx="12" fill="url(#bronze)" opacity=".92"/>
    <text y="49" class="lbl">STORE</text>
    <text y="62" class="tiny">lake · warehouse</text>
  </g>
  <g transform="translate(450,190)">
    <rect x="-46" y="-34" width="92" height="68" rx="12" fill="url(#silver)" opacity=".92"/>
    <text y="49" class="lbl">TRANSFORM</text>
    <text y="62" class="tiny">model · test · govern</text>
    <!-- fault + heal on the silver chamber -->
    <g class="fault">
      <rect x="-50" y="-38" width="100" height="76" rx="14" fill="none" stroke="#ff5470" stroke-width="3" filter="url(#glow)"/>
      <text y="-46" class="lbl" style="fill:#ff8095">SCHEMA DRIFT</text>
    </g>
    <g class="heal">
      <rect x="-50" y="-38" width="100" height="76" rx="14" fill="none" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
      <text y="-46" class="lbl" style="fill:#6ee7b7">SELF-HEALED ✓</text>
    </g>
  </g>
  <g transform="translate(640,190)">
    <rect x="-46" y="-34" width="92" height="68" rx="12" fill="url(#gold)" opacity=".95"/>
    <text y="49" class="lbl">SERVE</text>
    <text y="62" class="tiny">BI · APIs · features</text>
  </g>
  <g transform="translate(830,190)">
    <circle r="14" fill="#1b2747" stroke="#ffd166" stroke-width="2"/>
    <text y="40" class="lbl">AI · INSIGHT</text>
    <text y="55" class="tiny">ML · LLM apps</text>
  </g>

  <!-- data packets -->
  <g filter="url(#glow)">
    <circle r="4" fill="#5ec8ff"><animateMotion dur="4s" repeatCount="indefinite" path="M70 190 H830"/></circle>
    <circle r="4" fill="#5ec8ff"><animateMotion dur="4s" begin="1s" repeatCount="indefinite" path="M70 190 H830"/></circle>
    <circle r="4" fill="#5ec8ff"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M70 190 H830"/></circle>
    <circle r="4" fill="#5ec8ff"><animateMotion dur="4s" begin="3s" repeatCount="indefinite" path="M70 190 H830"/></circle>
  </g>

  <!-- sentinel eye above silver -->
  <g transform="translate(450,118)">
    <circle r="9" fill="#0b1020" stroke="#a78bfa" stroke-width="2"/>
    <circle r="3" fill="#a78bfa" class="pulse"/>
  </g>
  <path d="M450 127 V152" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/>
  <text x="472" y="122" class="sub" style="font-size:12px;fill:#c4b5fd">sentinel</text>
</svg>
