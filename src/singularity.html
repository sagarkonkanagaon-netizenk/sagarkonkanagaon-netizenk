<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #wrap{position:relative;width:1200px;height:450px;overflow:hidden;font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
  canvas{display:block}
  .shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 24%,rgba(0,0,0,0) 44%),
               radial-gradient(ellipse at 60% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay}
  .lb{position:absolute;left:0;right:0;height:30px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 26px;box-sizing:border-box}
  .lb span{font:600 9.5px 'JetBrains Mono',Consolas,monospace;letter-spacing:3.2px;color:#6f7896}
  .lb.top{top:0}.lb.bot{bottom:0}
  .lb b{color:#5eead4;font-weight:800}
  .live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;margin-right:9px;vertical-align:1px}
  .title{position:absolute;left:44px;top:96px}
  .eyebrow{font:700 10px 'JetBrains Mono',Consolas,monospace;letter-spacing:5px;color:#f5c451;margin:0 0 14px;display:flex;align-items:center;gap:12px}
  .eyebrow:before{content:'';width:28px;height:1.5px;background:#f5c451}
  h1{margin:0;font-family:'Inter Display',Inter,sans-serif;font-weight:900;font-size:58px;letter-spacing:-1.8px;line-height:.92;
    background:linear-gradient(100deg,#fff 0%,#fff 40%,#ffe7a8 47%,#fff 54%,#fff 100%);background-size:260% 100%;-webkit-background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 24px rgba(0,0,0,.6))}
  h1 .last{background:linear-gradient(100deg,#f8d47a 0%,#f5c451 40%,#fff3cf 50%,#e9a23b 60%,#f5c451 100%);background-size:260% 100%;-webkit-background-clip:text;color:transparent}
  .sub{margin:18px 0 0;font-size:16px;font-weight:500;color:#b9c0d8;line-height:1.5;letter-spacing:.1px}
  .sub em{font-style:normal;color:#fff;font-weight:700}
  .tag{position:absolute;font:700 9px 'JetBrains Mono',Consolas,monospace;letter-spacing:2.6px;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .tag i{display:block;width:22px;height:1px}
  .t1{color:#c4a3ff}.t1 i{background:#c4a3ff}
  .t2{color:#dbe4f0}.t2 i{background:#dbe4f0}
  .t3{color:#f5c451}.t3 i{background:#f5c451}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="wrap">
  <div class="shade"></div>
  <canvas class="grain" id="grain" width="1200" height="450"></canvas>
  <div class="title">
    <p class="eyebrow">SENIOR DATA ENGINEER</p>
    <h1>Sagar<br><span class="last">Konkanagaon</span></h1>
    <p class="sub">All data falls toward one thing:<br><em>a single source of truth.</em></p>
  </div>
  <div class="tag t1" id="T1"><i></i>RAW EDGE</div>
  <div class="tag t2" id="T2"><i></i>CLEANED</div>
  <div class="tag t3" id="T3"><i></i>GOLD CORE</div>
  <div class="lb top"><span>INGEST · STORE · TRANSFORM · ORCHESTRATE · TEST · SERVE</span><span>BENGALURU · IN</span></div>
  <div class="lb bot"><span>SPARK · DATABRICKS · DELTA LAKE · AIRFLOW · BIGQUERY · KAFKA · PYTHON · SQL</span><span><i class="live"></i><b>OPEN TO SENIOR DE ROLES</b></span></div>
</div>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const W=1200,H=450,T=10;
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
document.getElementById('wrap').prepend(renderer.domElement);
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const frag=/*glsl*/`
precision highp float;
uniform float uT;      // time 0..T
uniform float uLoop;   // T
uniform vec2 uRes;
uniform vec3 uCam;
varying vec2 vUv;
#define PI 3.14159265
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float h31(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
float vn3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}

const float RIN=2.6, ROUT=13.0;

// disk emission at radius r, angle a, time t (rotating frame)
vec4 diskAt(float r,float a,float t){
  float w=2.2/pow(r,1.5);           // keplerian-ish angular speed
  float ar=a+w*t*2.0;               // rotated angle
  float x=(r-RIN)/(ROUT-RIN);       // 0 inner .. 1 outer
  // streaky turbulence, stretched along the orbit
  vec2 q=vec2(ar*3.0/PI*2.0, log(r)*9.0);
  float n=fbm(vec2(q.x*1.0,q.y*1.0));
  float n2=fbm(vec2(q.x*2.5+5.,q.y*2.2));
  float streak=pow(n,1.6)*1.6+n2*.35;
  // "data bits": little cells that ride the flow, mostly in the outer/raw zone
  float cells=0.;
  {
    vec2 g=vec2(ar*(24.0+floor(r)*4.0)/(2.*PI), r*5.0);
    vec2 id=floor(g),f=fract(g)-.5;
    float on=step(.86,h21(id+floor(r)));
    float sq=smoothstep(.34,.22,max(abs(f.x),abs(f.y)));
    cells=on*sq;
  }
  // medallion colouring by radius: outer raw (violet/red chaos) -> silver -> gold core
  vec3 raw=mix(vec3(.55,.25,1.0),vec3(1.0,.28,.35),n2);
  vec3 silver=vec3(.62,.78,1.0);
  vec3 gold=vec3(1.0,.62,.16);
  vec3 hot=vec3(1.0,.95,.82);
  vec3 col=x>.6?mix(silver,raw,smoothstep(.6,.85,x)):x>.38?mix(gold,silver,smoothstep(.38,.6,x)):mix(hot,gold,smoothstep(.0,.16,x));
  float chaos=smoothstep(.55,1.,x);
  float bright=mix(2.6,.6,pow(x,.6))*(.15+pow(streak,1.4)*(1.1+chaos*.6));
  bright+=cells*(.4+1.6*chaos)*1.4;
  // soft edges
  float edge=smoothstep(0.,.05,x)*smoothstep(1.,.78,x);
  float alpha=clamp(edge*(.18+streak*.95+cells*.7),0.,1.);
  return vec4(col*bright*edge,alpha);
}
vec4 disk(vec3 p,vec3 rd,float r){
  float a=atan(p.z,p.x);
  float t=uT, L=uLoop, k=t/L;
  vec4 c=mix(diskAt(r,a,t),diskAt(r,a,t-L),k);   // seamless loop crossfade
  // doppler beaming: disk spins counter-clockwise seen from above
  vec3 tang=normalize(vec3(-p.z,0.,p.x));
  float d=dot(tang,-rd);
  float beam=pow(1.0+.5*d,2.6);
  c.rgb*=beam;
  return c;
}
vec3 sky(vec3 d){
  vec3 c=vec3(0.);
  // nebula
  float n=fbm(d.xy*2.2+d.z*1.3+3.);
  float m=fbm(d.yz*3.1-d.x*2.+7.);
  c+=vec3(.02,.07,.09)*pow(n,3.)*1.2+vec3(.07,.02,.10)*pow(m,3.5)*1.0;
  // stars
  vec3 g=d*180.;vec3 id=floor(g);float h=h31(id);
  vec3 f=fract(g)-.5;
  float s=smoothstep(.07,.0,length(f))*step(.95,h);
  c+=s*mix(vec3(.7,.8,1.),vec3(1.,.85,.6),h31(id+3.))*(1.5+h*3.);
  return c;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-vec2(uRes.x*.63,uRes.y*.50))/uRes.y;
  vec3 ro=uCam;
  vec3 ta=vec3(0.,0.,0.);
  vec3 fw=normalize(ta-ro),rt=normalize(cross(fw,vec3(0,1,0))),up=cross(rt,fw);
  vec3 rd=normalize(fw*1.55+uv.x*rt+uv.y*up);
  rd=normalize(rd+vec3(0.,0.,0.));
  vec3 p=ro,v=rd;
  float h2=dot(cross(p,v),cross(p,v));
  vec3 acc=vec3(0.);float trans=1.;
  bool hit=false;
  for(int i=0;i<360;i++){
    float r2=dot(p,p);
    float dt=clamp(.045*r2,.03,.9)*.55;
    vec3 a=-1.5*h2*p/pow(r2,2.5);
    vec3 pp=p;
    v+=a*dt;p+=v*dt;
    if(dot(p,p)<1.0){hit=true;break;}
    if(pp.y*p.y<0.){
      float k=pp.y/(pp.y-p.y);vec3 c=mix(pp,p,k);float r=length(c.xz);
      if(r>RIN&&r<ROUT){vec4 dc=disk(c,normalize(v),r);acc+=trans*dc.rgb*dc.a*.28;trans*=1.-dc.a*.92;}
    }
    if(dot(p,p)>2500.)break;
    if(trans<.02)break;
  }
  vec3 col=acc;
  if(!hit)col+=trans*sky(normalize(v));
  // photon ring glow approximation by closest approach is implicit; add faint warm haze near the hole
  float rr=length(uv);
  
  gl_FragColor=vec4(col,1.);
}`;
const mat=new THREE.ShaderMaterial({uniforms:{uT:{value:0},uLoop:{value:T},uRes:{value:new THREE.Vector2(W,H)},uCam:{value:new THREE.Vector3()}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:frag,toneMapped:true});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.5,.3,.8));
composer.addPass(new OutputPass());

// film grain
const g=document.getElementById('grain').getContext('2d');
let sd=3;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
function grain(){const im=g.createImageData(W,H);for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0)}

const h1=document.querySelector('h1'),last=document.querySelector('.last');
function proj(x,y,z){const v=new THREE.Vector3(x,y,z);return v}
window.renderAt=(t)=>{
  const ph=t/T,TAU=Math.PI*2;
  const ang=-.35+Math.sin(ph*TAU)*.10, el=.16+Math.sin(ph*TAU*2)*.015, dist=30;
  const c=new THREE.Vector3(Math.sin(ang)*Math.cos(el)*dist,Math.sin(el)*dist,Math.cos(ang)*Math.cos(el)*dist);
  mat.uniforms.uT.value=t;mat.uniforms.uCam.value.copy(c);
  composer.render();grain();
  const sh=(100-((ph*2)%1)*200)+'% 0';h1.style.backgroundPosition=sh;last.style.backgroundPosition=sh;
};
// tag placement (fixed, tuned to the composition)
const place=(id,x,y)=>{const e=document.getElementById(id);e.style.left=x+'px';e.style.top=y+'px'};
place('T1',820,376);place('T2',930,376);place('T3',1040,376);
window.ready=true;window.renderAt(0);
</script>
</body></html>
