<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}#wrap{position:relative}canvas{display:block}</style></head>
<body><div id="wrap"><canvas id="c"></canvas></div>
<script>
const T=8,W=2172,H=724;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
const vs=`#version 300 es
in vec2 p;out vec2 uv0;void main(){uv0=p*.5+.5;uv0.y=1.-uv0.y;gl_Position=vec4(p,0,1);}`;
const fs=`#version 300 es
precision highp float;in vec2 uv0;out vec4 o;uniform sampler2D img;uniform float ph;uniform vec2 R;
#define TAU 6.2831853
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
float L(vec3 c){return dot(c,vec3(.299,.587,.114));}
vec3 tx(vec2 q){return texture(img,q).rgb;}
float hs(float x){return fract(sin(x*91.7)*43758.5);}
// looping downward streak field
float fallStreak(vec2 px,float spd){float col=floor(px.x/1.5);float k=floor(spd+hs(col)*3.);
  float a=.5+.5*sin(px.y*.11+hs(col+3.)*30.-TAU*k*ph);float b=.5+.5*sin(px.y*.045+hs(col+7.)*20.-TAU*(k-2.)*ph);
  return a*.6+b*.4;}
vec3 fall(vec3 c,vec2 px,vec4 r,float a,vec3 c1,vec3 c2,float spd,float mist){
  float hgt=r.w-r.z;float v=(px.y-r.z)/hgt; if(v<-.02||v>1.25) return c;
  float cx=(r.x+r.y)*.5;float hw=(r.y-r.x)*.5*(1.+v*.35);float u=(px.x-cx)/hw;
  float m=mist*exp(-pow((px.y-r.w)/(14.+hw*.4),2.))*exp(-pow((px.x-cx)/(hw*2.2),2.));
  vec2 circ=vec2(cos(TAU*ph),sin(TAU*ph));
  float mn=fbm(px*.05+circ*1.2);
  c+=m*mn*c2*.55;
  if(abs(u)>1.||v>1.) return c;
  float edge=1.-smoothstep(.55,1.,abs(u));float top=smoothstep(0.,.05,v);float bot=1.-smoothstep(.85,1.,v);
  float st=fallStreak(px,spd);
  vec3 wc=mix(c1,c2,st);float al=a*edge*top*bot*(.35+.65*st);
  return mix(c,wc,al)+c2*pow(st,6.)*edge*top*bot*a*.6;}
vec3 car(vec3 c,vec2 px,vec2 p0,vec2 p1,float k,float o,float arc,vec3 col,float sz){
  float u=fract(ph*k+o);vec2 dir=normalize(p1-p0);vec2 pos=mix(p0,p1,u)+vec2(0.,-sin(u*3.14159)*arc);
  float vis=smoothstep(0.,.06,u)*(1.-smoothstep(.94,1.,u));float L=90.*sz;
  vec2 q=px-pos;float t=clamp(dot(q,-dir)/L,0.,1.);float d=length(q+dir*t*L);
  float trail=exp(-d*d/(1.6*sz*sz))*pow(1.-t,2.);
  float head=exp(-dot(q,q)/(2.2*sz*sz));
  vec2 tl=pos-dir*3.*sz;float tail=exp(-dot(px-tl,px-tl)/(1.2*sz*sz));
  return c+vis*(trail*col*1.4+head*vec3(1.,1.,1.)*2.4+tail*vec3(1.,.15,.1)*1.2);}
vec3 ship(vec3 c,vec2 px,vec2 p0,vec2 p1,float o,float s){
  float u=fract(ph+o);vec2 pos=mix(p0,p1,u)+vec2(0.,sin(TAU*ph*2.+o*9.)*2.);
  float vis=smoothstep(0.,.08,u)*(1.-smoothstep(.92,1.,u));
  vec2 q=(px-pos)/vec2(16.*s,4.5*s);float e=length(q);
  float body=1.-smoothstep(.8,1.,e);vec2 qd=(px-pos-vec2(0.,-4.*s))/vec2(6.*s,4.*s);float dome=1.-smoothstep(.8,1.,length(qd));
  c=mix(c,vec3(.05,.06,.08),max(body,dome)*vis);
  c+=vis*exp(-pow((e-.92)/.08,2.))*vec3(.35,.8,1.)*.6*step(q.y,.2);
  float bl=step(.5,fract(ph*8.+o));
  vec2 l1=pos+vec2(15.*s,1.),l2=pos-vec2(15.*s,-1.);
  c+=vis*(exp(-dot(px-l1,px-l1)/3.)*vec3(1.,.2,.15)*bl*2.+exp(-dot(px-l2,px-l2)/3.)*vec3(.6,.9,1.)*(1.-bl)*2.);
  c+=vis*exp(-pow((px.x-pos.x)/(10.*s),2.))*smoothstep(pos.y,pos.y+40.*s,px.y)*(1.-smoothstep(pos.y+10.*s,pos.y+60.*s,px.y))*vec3(.4,.8,1.)*.25;
  return c;}

void main(){
  vec2 uv=uv0;
  vec2 px=uv*R; vec2 d=1./R;
  vec3 c=tx(uv); float l=L(c); float mx=max(c.r,max(c.g,c.b)),mn=min(c.r,min(c.g,c.b)); float sat=(mx-mn)/(mx+1e-3);
  float cool=smoothstep(0.,.08,c.b-c.r), warm=smoothstep(0.,.1,c.r-c.b);
  // ---- clouds: gentle churning (bottom + right haze) ----
  float cloudM=(1.-smoothstep(.18,.35,sat))*smoothstep(.22,.4,l)*(1.-smoothstep(.85,.95,l))*smoothstep(.55,.8,uv.y);
  vec2 circ=vec2(cos(TAU*ph),sin(TAU*ph))*1.6;
  float cn=fbm(px*.006+circ)-.5; c*=1.+cloudM*cn*.32;

  // ---- moon: slow libration + breathing halo ----
  {vec2 C=vec2(1960.,130.);float rr=115.;vec2 dv=(px-C)/rr;float dl=length(dv);
   if(dl<1.){float z=sqrt(1.-dl*dl);float an=.22*sin(TAU*ph);float xs=dv.x*cos(an)+z*sin(an);
     vec2 src=(C+vec2(clamp(xs,-.98,.98),dv.y)*rr)/R;vec3 sc=tx(src);
     float mm=(1.-smoothstep(.25,.4,sat))*smoothstep(.4,.55,l);float ms=(1.-smoothstep(.25,.4,(max(sc.r,max(sc.g,sc.b))-min(sc.r,min(sc.g,sc.b)))/(max(sc.r,max(sc.g,sc.b))+1e-3)))*smoothstep(.4,.55,L(sc));
     c=mix(c,sc*(1.+.08*sin(TAU*ph)),mm*ms*smoothstep(1.,.9,dl));}
   float halo=exp(-pow((dl-1.)/.05,2.))+exp(-(dl-1.)*6.)*step(1.,dl)*.5;c+=halo*vec3(.55,.75,1.)*(.12+.08*sin(TAU*ph))*(1.-smoothstep(.3,.8,l));}
  // ---- lava: molten churn on the chaotic left ----
  {float lavaM=warm*smoothstep(.3,.65,l)*(1.-smoothstep(.3,.42,uv.x));
   float txtBox=step(.03,uv.x)*step(uv.x,.3)*step(.24,uv.y)*step(uv.y,.6);lavaM*=1.-txtBox;
   vec2 cr=vec2(cos(TAU*ph),sin(TAU*ph));float m=fbm(px*.018+cr*1.5+vec2(0.,ph*0.));
   c*=1.+lavaM*(m-.45)*2.;c+=lavaM*vec3(1.,.38,.06)*pow(m,2.5)*1.4;}
  // ---- waterfalls: vertical bright cool structures flow downward ----
  float gx=abs(L(tx(uv+vec2(3.*d.x,0)))-L(tx(uv-vec2(3.*d.x,0)))), gy=abs(L(tx(uv+vec2(0,3.*d.y)))-L(tx(uv-vec2(0,3.*d.y))));
  float vert=smoothstep(.02,.12,gx-gy);
  float wf=smoothstep(.5,.8,l)*(1.-smoothstep(.35,.6,sat))*vert*step(.25,uv.y);
  float s1=sin(px.y*.16+n(vec2(px.x*.35,0.))*40.-TAU*6.*ph);
  float s2=sin(px.y*.07+n(vec2(px.x*.2,7.))*30.-TAU*3.*ph);
  float flow=.5+.5*s1*.6+.5*s2*.4;
  c*=1.+wf*(flow-.5)*.5; c+=wf*pow(max(0.,s1),8.)*vec3(.55,.85,1.)*.35;

  // ---- explicit waterfalls (existing ones + new ones pouring off the S and K) ----
  vec3 w1=vec3(.45,.72,.9),w2=vec3(.92,.99,1.);
  c=fall(c,px,vec4(800.,836.,505.,605.),0.95,w1,w2,7.,.9);
  c=fall(c,px,vec4(1028.,1068.,525.,635.),0.95,w1,w2,7.,.9);
  c=fall(c,px,vec4(1102.,1120.,208.,282.),0.85,w1,w2,6.,.4);
  c=fall(c,px,vec4(1150.,1176.,212.,288.),0.85,w1,w2,6.,.4);
  c=fall(c,px,vec4(1128.,1146.,68.,138.),0.80,w1,w2,6.,.3);
  c=fall(c,px,vec4(1040.,1060.,108.,162.),0.74,w1,w2,6.,.3);
  c=fall(c,px,vec4(1830.,1862.,163.,248.),0.95,w1,w2,7.,.6);
  c=fall(c,px,vec4(1862.,1902.,403.,458.),0.91,w1,w2,7.,.6);
  c=fall(c,px,vec4(1785.,1826.,512.,572.),0.95,w1,w2,7.,.7);
  c=fall(c,px,vec4(1938.,1962.,522.,578.),0.95,w1,w2,7.,.6);
  c=fall(c,px,vec4(2062.,2088.,245.,300.),0.74,w1,w2,6.,.4);
  // new: off the underside of the S ribbon and the K arms
  c=fall(c,px,vec4(1196.,1222.,478.,598.),0.95,w1,w2,8.,.9);
  c=fall(c,px,vec4(905.,925.,330.,450.),0.91,w1,w2,8.,.6);
  c=fall(c,px,vec4(1268.,1290.,300.,420.),0.91,w1,w2,8.,.6);
  c=fall(c,px,vec4(1655.,1678.,445.,560.),0.95,w1,w2,8.,.8);
  c=fall(c,px,vec4(1560.,1580.,250.,360.),0.85,w1,w2,8.,.6);
  c=fall(c,px,vec4(1735.,1752.,560.,660.),0.91,w1,w2,8.,.8);
  // lava falls on the left
  vec3 v1=vec3(.9,.25,.03),v2=vec3(1.,.8,.35);
  c=fall(c,px,vec4(558.,572.,118.,195.),0.95,v1,v2,4.,.7);
  c=fall(c,px,vec4(452.,464.,105.,165.),0.95,v1,v2,4.,.6);
  c=fall(c,px,vec4(30.,48.,520.,650.),0.95,v1,v2,4.,.8);
  c=fall(c,px,vec4(232.,246.,470.,560.),0.95,v1,v2,4.,.8);
  // ---- flying cars and craft ----
  c=car(c,px,vec2(1180.,40.),vec2(1500.,14.),1.,.0,10.,vec3(.4,.85,1.),1.);
  c=car(c,px,vec2(2172.,62.),vec2(1550.,120.),1.,.35,8.,vec3(.8,.95,1.),1.2);
  c=car(c,px,vec2(1560.,30.),vec2(2172.,10.),2.,.6,6.,vec3(.4,.85,1.),.8);
  c=car(c,px,vec2(2172.,330.),vec2(1700.,300.),1.,.2,12.,vec3(.5,.9,1.),1.1);
  c=car(c,px,vec2(1650.,356.),vec2(2172.,385.),1.,.7,6.,vec3(.9,.95,1.),.9);
  c=car(c,px,vec2(380.,452.),vec2(720.,430.),1.,.1,8.,vec3(1.,.65,.3),1.);
  c=car(c,px,vec2(720.,478.),vec2(330.,500.),1.,.55,6.,vec3(1.,.55,.2),.9);
  c=car(c,px,vec2(1250.,252.),vec2(1420.,170.),2.,.3,4.,vec3(.4,.85,1.),.7);
  c=car(c,px,vec2(1880.,562.),vec2(2172.,520.),1.,.45,6.,vec3(.6,.9,1.),1.);
  c=car(c,px,vec2(1990.,180.),vec2(1700.,150.),1.,.82,10.,vec3(.4,.85,1.),.9);
  c=ship(c,px,vec2(1590.,96.),vec2(1840.,72.),.15,1.);
  c=ship(c,px,vec2(1490.,44.),vec2(1300.,64.),.6,.7);
  // ---- data running along highways: glints sweep left->right over highlights ----
  float hm=smoothstep(.45,.85,l);
  float lane=n(vec2(px.y*.08,3.))*30.;
  float g1=pow(max(0.,sin(px.x*.045+lane-TAU*5.*ph)),24.);
  float g2=pow(max(0.,sin(px.x*.011-px.y*.004-TAU*2.*ph)),10.);
  vec3 gc=mix(vec3(1.,.72,.35),vec3(.45,.9,1.),smoothstep(.3,.6,uv.x));
  c+=hm*(g1*.8+g2*.5)*gc*(1.-wf);
  // ---- crystal core pulse ----
  vec2 cc=vec2(.59,.435); vec2 dv=(uv-cc)*vec2(R.x/R.y,1.); float r=length(dv);
  float pulse=.5+.5*sin(TAU*2.*ph);
  float inC=1.-smoothstep(.07,.11,r);
  c*=1.+inC*hm*(.25+.45*pulse);
  float ang=atan(dv.y,dv.x);
  float rays=pow(max(0.,sin(ang*9.+TAU*ph)),6.)*exp(-r*9.);
  c+=vec3(1.,.78,.42)*(exp(-r*r*260.)*(.18+.22*pulse)+rays*.10*(.6+.4*pulse));
  // light scan ring expanding from the core
  float rp=fract(ph*2.); float ring=exp(-pow((r-rp*.45)/.006,2.))*(1.-rp)*.5;
  c+=ring*vec3(.5,.85,1.)*hm*1.4;
  // ---- embers rising on the chaotic left, motes on the right ----
  vec3 add=vec3(0);
  for(int k=0;k<2;k++){float sc=k==0?55.:30.; vec2 g=px/sc; vec2 id=floor(g);
    float rr=h(id+float(k)*17.); float sp=floor(1.+rr*3.);
    vec2 pos=vec2(h(id+3.1)*.8+.1+.08*sin(TAU*(ph+rr)),fract(h(id+9.7)-ph*sp));
    vec2 f=fract(g); f.y=fract(f.y+ph*sp)- (fract(f.y+ph*sp)-f.y); // keep
    vec2 pp=vec2(h(id+3.1)*.8+.1+.08*sin(TAU*(ph+rr)), 1.-fract(h(id+9.7)+ph*sp));
    float dd=length(fract(g)-pp)*sc; float on=step(.55,rr);
    float tw=.6+.4*sin(TAU*(3.*ph+rr));
    vec3 col=mix(vec3(1.,.62,.25),vec3(.5,.9,1.),smoothstep(.35,.65,uv.x));
    add+=col*on*tw*exp(-dd*dd*(k==0?.5:.9))*(k==0?.9:.5);}
  c+=add*(1.-smoothstep(.3,.75,l))*(1.-step(.03,uv.x)*step(uv.x,.30)*step(.24,uv.y)*step(uv.y,.6));
  // ---- name shimmer ----
  vec2 tb=vec2(.03,.295);float inT=step(tb.x,uv.x)*step(uv.x,tb.y)*step(.24,uv.y)*step(uv.y,.6);
  float txt=inT*smoothstep(.62,.85,l)*(1.-smoothstep(.2,.35,sat));
  float sw=ph/.35; float bx=mix(-.05,.36,sw); float band=sw<1.?exp(-pow((uv.x-bx+ (uv.y-.4)*.15)/.018,2.)):0.;
  c+=txt*band*vec3(.75,.92,1.)*.9;
  o=vec4(c,1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.log('ERROR '+gl.getShaderInfoLog(x));return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.uniform2f(gl.getUniformLocation(pr,'R'),W,H);window.ready=true;window.renderAt(0);};
im.src='architecture-still.png';
window.renderAt=t=>{gl.viewport(0,0,W,H);gl.uniform1f(gl.getUniformLocation(pr,'ph'),(t%T)/T);gl.drawArrays(gl.TRIANGLES,0,3);};
</script></body></html>
